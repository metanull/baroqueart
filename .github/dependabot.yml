# Daily checks on third-party dependencies, each waiting out a 7-day cooldown
# so a release has time to be withdrawn before it reaches a site.
version: 2
updates:
  # The @museumwnf platform packages (viewer-core, viewer-layout, viewer-i18n
  # and the dataset package) are IGNORED here, and that is no longer a
  # technical necessity — they publish publicly to npmjs now, so Dependabot
  # can read them without a token.
  #
  # They stay ignored because their updates are deliberate, not automatic: a
  # release of any of them is rolled out to every consuming site by hand, one
  # pull request per site, right after the release, through the
  # release-then-propagate procedure in metanull/viewer-workflows
  # (`tools/propagate.mjs`). A Dependabot bump would race that procedure and
  # could land a platform version this site was never actually walked
  # through.
  #
  # Nothing else is lost by it: third-party dependencies (vue, vite, eslint,
  # and the rest) still flow through Dependabot as normal.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@museumwnf/*"

  # The reusable workflows in metanull/viewer-workflows are pinned to an exact
  # version in .github/workflows/*.yml, never to a moving major tag. Dependabot
  # covers reusable-workflow refs as well as step-level actions, so a new
  # viewer-workflows release arrives here as a pull request that runs this
  # site's own CI before it is adopted — instead of a force-moved `v1`
  # deploying untested CI to every repo at once. Green minor/patch bumps
  # auto-merge via automerge.yml; majors wait for a human.
  #
  # This ecosystem is unrelated to the npm scope above: it resolves against
  # the GitHub API, not against an npm registry.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
